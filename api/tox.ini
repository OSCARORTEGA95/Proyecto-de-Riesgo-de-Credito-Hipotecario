# Ambientes de la API, como en el Taller 6:
#   tox run -e test_app   instala la API y el modelo (model-pkg/*.whl) y corre las pruebas
#   tox run -e run        levanta la API en el puerto 8001
# Si reconstruyes el .whl con la misma versión, agrega -r para recrear el ambiente:
#   tox run -r -e test_app

[tox]
min_version = 4
envlist = test_app
skipsdist = True

[testenv]
basepython = python3
install_command = pip install {opts} {packages}
setenv =
	PYTHONPATH=.
	PYTHONHASHSEED=0

[testenv:test_app]
deps =
	-rtest_requirements.txt
commands =
	pytest -vv {posargs:app/tests/}

[testenv:run]
envdir = {toxworkdir}/test_app
deps =
	{[testenv:test_app]deps}
commands =
	python app/main.py

[testenv:typechecks]
envdir = {toxworkdir}/typechecks
deps =
	-rtyping_requirements.txt
commands = {posargs:mypy app --ignore-missing-imports}

[testenv:lint]
envdir = {toxworkdir}/lint
deps =
	-rtyping_requirements.txt
commands = flake8 app --max-line-length 120
