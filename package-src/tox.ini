# Ambientes del paquete, como en el Taller 5:
#   tox run -e train          entrena la red y la guarda en modelo_riesgo/trained_models
#   tox run -e test_package   corre las pruebas con el modelo entrenado
# Requiere los datos de la pregunta 1 descargados con DVC en ../data/modelado/p1
# (dvc pull --glob "data/modelado/p1/*" desde la raíz del repositorio).

[tox]
min_version = 4
envlist = test_package
skipsdist = True

[testenv]
basepython = python3
install_command = pip install {opts} {packages}
setenv =
	PYTHONPATH=.
	PYTHONHASHSEED=0
passenv =
	MLFLOW_TRACKING_URI
	AWS_ACCESS_KEY_ID
	AWS_SECRET_ACCESS_KEY
	AWS_SESSION_TOKEN

[testenv:test_package]
envdir = {toxworkdir}/test_package
deps =
	-r{toxinidir}/requirements/test_requirements.txt
commands =
	pytest -s -vv tests/

[testenv:train]
envdir = {toxworkdir}/train
deps =
	-r{toxinidir}/requirements/train_requirements.txt
commands =
	python modelo_riesgo/train_pipeline.py

[testenv:typechecks]
envdir = {toxworkdir}/typechecks
deps =
	-r{toxinidir}/requirements/typing_requirements.txt
commands = {posargs:mypy modelo_riesgo --ignore-missing-imports}

[testenv:lint]
envdir = {toxworkdir}/lint
deps =
	-r{toxinidir}/requirements/typing_requirements.txt
commands = flake8 modelo_riesgo tests --max-line-length 120
