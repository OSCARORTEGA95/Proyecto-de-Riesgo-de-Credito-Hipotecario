# Configuración del paquete: modelo de la pregunta 1 (red neuronal) y de la pregunta 2 (k vecinos).
# Antes de entrenar con "tox run -e train", revisa en MLflow (experimento red-p1) cuál
# arquitectura ganó y copia aquí sus capas y su dropout. Si cambias algo, sube VERSION.

package_name: modelo_riesgo
pipeline_save_file: modelo_red_p1_v

# Datos: tabla de la pregunta 1 que produce el ETL y se descarga con DVC.
# La ruta es relativa a la carpeta package-src (la raíz del repositorio queda un nivel arriba).
ruta_datos: ../data/modelado/p1
etiqueta: y_p1

# Partición temporal, la misma de los demás modelos (config/modelos_knn.yaml)
seleccion: [2022Q1, 2022Q2, 2022Q3, 2022Q4, 2023Q1, 2023Q2]
validacion: [2023Q3, 2023Q4]
entrenamiento: [2022Q1, 2022Q2, 2022Q3, 2022Q4, 2023Q1, 2023Q2, 2023Q3, 2023Q4]
prueba: [2024Q1, 2024Q2, 2024Q3, 2024Q4]
max_validacion: 200000
proporcion_negativos: 10       # todos los positivos y 10 negativos por positivo
semilla: 42

# Variables que usa el modelo: los nueve campos del formulario del tablero.
# La API acepta las 17 variables de la solicitud; las que no estén aquí se ignoran.
# Si quitas una variable de estas listas, el modelo deja de pedirla (Taller 5, parte 4).
variables_numericas: [credit_score, dti, oltv, orig_upb, orig_rate, orig_term]
variables_categoricas: [purpose, prop_type, state]

# Arquitectura de la red: copiar la mejor ejecución del experimento red-p1
red:
  capas: [64, 32]          # versión 5 de red-p1: la mejor en validación
  dropout: 0.3
  epocas_max: 60
  paciencia: 8
  tam_lote: 512
  tasa_aprendizaje: 0.001
  l2: 0.00001

# Si MLFLOW_TRACKING_URI está definida y mlflow instalado, el entrenamiento se registra aquí
experimento_mlflow: red-p1

# Pregunta 2: ¿qué créditos activos y al día llegarán a 90 días de mora en los próximos 3 meses?
# Modelo ganador en validación del experimento knn-p2 (versión 1, AUC de validación 0,875).
# No se reentrena aquí: "tox run -e p2" copia el pipeline que exportó src/riesgo_credito/modelos/knn.py
# (carpeta modelos/knn/p2/v1, versionada en Git) con su corrección r y sus métricas.
# Si la red recurrente (rnn-p2) supera 0,875 en validación, se cambia el origen y la descripción.
p2:
  modelo_origen: ../modelos/knn/p2/v1
  archivo: modelo_knn_p2.joblib
  descripcion: k vecinos más cercanos, versión 1 (experimento knn-p2)
  variables_numericas: [edad, pct_saldo, dif_tasa, eltv, atrasos_12m, max_atraso_12m, meses_desde_atraso,
                        indulgencia_12m, credit_score, dti, oltv, ocltv, orig_rate, orig_upb, orig_term, mi_pct,
                        num_borrowers, num_units]
  variables_banderas: [con_atraso_previo, diferimiento, diferimiento_mes, saldo_sin_interes, mora_desastre,
                       modificado]
  variables_categoricas: [plan_asistencia, purpose, occupancy, channel, first_time_homebuyer, prop_type,
                          valuation_method]
